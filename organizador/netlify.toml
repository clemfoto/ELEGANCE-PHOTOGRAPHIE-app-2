# Sitio de Netlify propio para el organizador (base directory: organizador).
[build]
  command = "npm run build"
  publish = ".next"

[functions]
  directory = "netlify/functions"

# Adaptador de Next.js (el sitio se creó por API, así que hay que declararlo).
[[plugins]]
  package = "@netlify/plugin-nextjs"
