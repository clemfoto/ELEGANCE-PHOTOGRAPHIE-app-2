# Netlify: estos valores están también en el código y la documentación (no son secretos por sí solos:
# sin DATABASE_URL, SUPABASE_SERVICE_ROLE_KEY ni TELEGRAM_BOT_TOKEN no dan acceso a nada). Se excluyen del escaneo de secretos
# para que el despliegue no se bloquee aunque se marquen como "secret" en Netlify.
# AIRTABLE_BASE_ID: el ID de la antigua base sigue en la documentación y la migración.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "AIRTABLE_BASE_ID,SUPABASE_URL,TELEGRAM_ADMIN_CHAT_ID,TELEGRAM_VIDEOS_CHAT_ID"
